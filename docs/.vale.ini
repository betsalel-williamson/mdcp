# Peer Vale config for this docs tree.
# Multi-language model (Vale OSS): markup engine stays shared; language-specific
# grammar/style rules live in style packages assigned by glob/path sections.
# Example for a mixed-language tree (not enabled here — this repo is en-US only):
#
#   [*.md]
#   BasedOnStyles = General, En
#
#   [*.{de,es,fr}.md]
#   BasedOnStyles = General
#
# Packages = Microsoft is an English style-guide package (US English).
# MDCP style (en-US chapter-cue rules) ships in @bwilliamson/mdcp-presets/vale/MDCP
# and is linked into StylesPath by `pnpm vale:sync`.
# GFM / Markdown structure is enforced separately via markdownlint.
# See docs/features/design-constraints/locale-and-language.md
StylesPath = styles
MinAlertLevel = suggestion

Packages = Microsoft

[*.md]
BasedOnStyles = Microsoft, MDCP

# Ignore already-linked markdown so MDCP chapter-cue rules do not false-positive on link labels.
TokenIgnores = (?s)\[.*?\]\(.*?\)
# Ignore ATX heading lines (chapter titles in headings are not bare cross-refs).
BlockIgnores = (?m)^#+ .*

Microsoft.Adverbs = NO
Microsoft.FirstPerson = NO
Microsoft.We = NO
Microsoft.SentenceLength = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Contractions = NO
Microsoft.Terms = NO
Microsoft.Dashes = NO
Microsoft.Headings = NO
Microsoft.HeadingAcronyms = NO
Microsoft.HeadingColons = NO
Microsoft.Acronyms = NO
Microsoft.Semicolon = NO
Microsoft.GeneralURL = NO
Microsoft.URLFormat = NO
Microsoft.Foreign = NO
Microsoft.Auto = NO
Microsoft.Quotes = NO
Microsoft.Units = NO

Microsoft.Passive = suggestion
Microsoft.Wordiness = suggestion
Microsoft.Accessibility = suggestion
Microsoft.Vocab = NO
