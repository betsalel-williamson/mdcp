name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Force JS actions onto Node 24 (Node 20 deprecated on runners).
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # Version commit, tags, GitHub Releases
      pull-requests: write # Version Packages PR
      id-token: write # npm OIDC Trusted Publishing
    environment: release
    steps:
      # Harden-Runner: audit mode only — logs egress; block mode is follow-up (#179).
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history for changesets; do not persist credentials into the workspace
          # (GITHUB_TOKEN is passed only to changesets/action below).
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      # Build before version/publish so husky pre-commit on the Version Packages
      # commit can run affected tests (they need packages/*/dist). Keeps the same
      # local hook gate the old interactive release:tag path had on a built tree.
      - run: pnpm build

      - name: Reject major bumps
        run: pnpm changeset:reject-major

      - name: Create Version Packages PR or publish
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm release:version
          publish: pnpm release:publish
          title: 'chore: version packages'
          commit: 'chore: version packages'
          createGithubReleases: true
        env:
          # Prefer RELEASE_GITHUB_TOKEN (PAT or GitHub App installation token).
          # Events from the default GITHUB_TOKEN do not start other workflows, so
          # Version Packages PRs opened with GITHUB_TOKEN never get CI checks and
          # can sit blocked on required status checks. See Publishing docs.
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
