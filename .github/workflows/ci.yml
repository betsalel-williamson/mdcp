name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Any target branch (stacked feature PRs, not only main).
    # Changeset checks use github.event.pull_request.base.sha — never a hardcoded branch name.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Vale
        run: |
          VALE_VERSION=3.15.1
          curl -fsSL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar xz -C /usr/local/bin vale

      - run: pnpm run verify:peers
      - run: pnpm audit --audit-level=high
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm run skill:validate
      - run: pnpm run prepare:docs
      - run: pnpm run docs:check
      - run: pnpm run docs:compile
      - name: Ensure documentation outputs are up-to-date
        run: git diff --exit-code

  changeset:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require changeset when packages or skills change
        env:
          CHANGESET_SINCE: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "Changeset since PR base: $CHANGESET_SINCE (${{ github.event.pull_request.base.ref }})"
          pnpm changeset:status
