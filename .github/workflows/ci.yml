name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Any target branch (stacked feature PRs, not only main).
    # Changeset checks use github.event.pull_request.base.sha — never a hardcoded branch name.

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Vale
        run: |
          VALE_VERSION=3.15.1
          curl -fsSL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | sudo tar xz -C /usr/local/bin vale

      - run: pnpm run verify:peers
      - run: pnpm audit --audit-level=high
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm run test
      - run: pnpm run skill:lint
      - run: pnpm run skill:validate
      - run: pnpm run prepare:docs
      - run: pnpm run docs:check
      - run: pnpm run docs:compile
      - name: Ensure documentation outputs are up-to-date
        run: git diff --exit-code

  changeset:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require changeset when packages change
        run: |
          # Compare against this PR's base commit (works for any target branch).
          BASE="${{ github.event.pull_request.base.sha }}"
          echo "Changeset since PR base: $BASE (${{ github.event.pull_request.base.ref }})"
          set +e
          pnpm exec changeset status --since="$BASE"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            exit 0
          fi
          # Release PRs run `changeset version` in-branch: changesets are consumed and
          # package versions bump, which makes `changeset status` fail even though the
          # release notes are already in CHANGELOG. Allow when this PR deleted changesets.
          CONSUMED=$(git diff --name-only --diff-filter=D "$BASE"..HEAD -- '.changeset/*.md' | wc -l | tr -d ' ')
          if [ "$CONSUMED" -gt 0 ]; then
            echo "Changesets consumed in this PR (release versioning) — skipping require-changeset check."
            exit 0
          fi
          exit 1
