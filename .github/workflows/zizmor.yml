name: 'Zizmor'

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Advisory during rollout: continue-on-error keeps the job green so findings
      # do not block merge yet. Treat this check as non-enforcing until removed.
      # Annotations alone can truncate (~10/run); always read the job log.
      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        continue-on-error: true
        with:
          advanced-security: false
          annotations: true
