name: Skills audit sync

on:
  schedule:
    - cron: '0 6 * * 1'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Bypass 24h spacing between successful syncs
        type: boolean
        default: false

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Set sync trigger
        id: trigger
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "kind=dispatch" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * 1" ]; then
            echo "kind=weekly" >> "$GITHUB_OUTPUT"
          else
            echo "kind=daily" >> "$GITHUB_OUTPUT"
          fi

      - name: Run skills audit sync
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKILLS_AUDIT_PROXY_URL: ${{ vars.SKILLS_AUDIT_PROXY_URL }}
          SKILLS_AUDIT_TRIGGER: ${{ steps.trigger.outputs.kind }}
          SKILLS_AUDIT_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '' }}
        run: pnpm skills-audit:sync
