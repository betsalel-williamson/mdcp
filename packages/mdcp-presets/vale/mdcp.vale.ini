# Sample Vale config for MDCP consumers.
# Copy into your docs root (or merge into an existing .vale.ini), then either:
#   - set StylesPath to this package's vale/ directory, or
#   - copy vale/MDCP into your StylesPath next to other styles (e.g. Microsoft).
#
# TokenIgnores drops already-linked markdown so link labels do not false-positive.
# BlockIgnores drops ATX heading lines (chapter titles in H1s are not bare cross-refs).
#
# See packages/mdcp-presets/README.md and
# docs/features/design-constraints/locale-and-language.md

StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = MDCP
TokenIgnores = (?s)\[.*?\]\(.*?\)
BlockIgnores = (?m)^#+ .*
