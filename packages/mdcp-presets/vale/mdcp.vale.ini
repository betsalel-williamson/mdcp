# Sample Vale config for MDCP consumers.
#
# Preferred package install for release zips:
#   Packages = https://github.com/betsalel-williamson/mdcp/releases/download/<tag>/mdcp-presets-vale.zip
#   vale sync
#
# Vale 3.15.1 syncs local directory packages from node_modules as style files
# but moves the package .vale.ini, so npm-directory installs should copy or
# symlink node_modules/@bwilliamson/mdcp-presets/vale/MDCP into StylesPath.
#
# Merge with other packages by listing each one and combining styles:
#   Packages = Microsoft, https://github.com/betsalel-williamson/mdcp/releases/download/<tag>/mdcp-presets-vale.zip
#   BasedOnStyles = Microsoft, MDCP
#
# The MDCP package config enables the MDCP style and ignores already-linked GFM
# markdown tokens. Keep TokenIgnores locally for npm-directory fallback installs.
# Add repo-local overrides here only when your docs need them. For example, to
# ignore ATX headings in repos that use chapter titles in H1/H2 text:
#   BlockIgnores = (?m)^#+ .*

StylesPath = styles
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = MDCP
TokenIgnores = (?s)\[.*?\]\(.*?\)
