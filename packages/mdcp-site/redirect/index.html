<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MDCP is now Merlon Docs</title>
    <meta
      name="description"
      content="MDCP is now Merlon Docs. This site has moved to merlon-docs.github.io/merlon."
    />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://merlon-docs.github.io/merlon/" />
    <meta http-equiv="refresh" content="5; url=https://merlon-docs.github.io/merlon/" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1b1f24;
        --muted: #57606a;
        --accent: #0b6bcb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e6edf3;
          --muted: #9da7b3;
          --accent: #58a6ff;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font:
          18px/1.6 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 36rem;
        padding: 2rem 1rem;
        text-align: center;
      }
      h1 {
        font-size: 2.25rem;
        line-height: 1.2;
        margin: 0 0 1rem;
      }
      p {
        margin: 0 0 1rem;
      }
      .muted {
        color: var(--muted);
        font-size: 0.95rem;
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MDCP is now Merlon Docs!</h1>
      <p>
        MDCP reached 1.0.0 under its new name. Taking you to
        <a href="https://merlon-docs.github.io/merlon/">merlon-docs.github.io/merlon</a>…
      </p>
      <p class="muted">
        You are free to keep using MDCP. The archived repository stays at
        <a href="https://github.com/betsalel-williamson/mdcp">github.com/betsalel-williamson/mdcp</a
        >, and the new project lives at
        <a href="https://github.com/Merlon-Docs/merlon">github.com/Merlon-Docs/merlon</a>.
      </p>
    </main>
  </body>
</html>
